plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}
version = project.mod_version
group = 'me.arycer'
base { archivesName = 'stagecraft' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation include('org.luaj:luaj-jse:3.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('examples') { into 'stagecraft/examples' }
}
tasks.register('collectHeadlessMods', Sync) {
    dependsOn tasks.named('remapJar')
    from(tasks.named('remapJar'))
    from(configurations.modImplementation) { include "fabric-api-${project.fabric_version}.jar" }
    into layout.buildDirectory.dir('headless-mods')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xlint:all')
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
jar { from('LICENSE') { rename { 'LICENSE_stagecraft' } } }
